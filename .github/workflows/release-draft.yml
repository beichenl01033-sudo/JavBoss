name: release-draft

on:
  workflow_dispatch:
    inputs:
      release:
        description: "New release version and Git tag, for example v1.8.2"
        required: true
      publish_browser_extension:
        description: "Include the browser extension in the draft release"
        type: boolean
        default: true

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  NODE_VERSION: "23.11.0"
  RELEASE: ${{ inputs.release }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - windows-x86_64
          - macos-arm64
    # Cross-build Apple Silicon on Intel hosts to avoid ARM runner capacity shortages.
    runs-on: ${{ fromJson('{"windows-x86_64":"ubuntu-24.04","macos-arm64":"macos-15-intel"}')[matrix.platform] }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build deps (Windows target)
        if: ${{ matrix.platform == 'windows-x86_64' }}
        timeout-minutes: 10
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends gcc-mingw-w64-x86-64-posix zip unzip

      - name: Build CLI bundle
        run: |
          cd scripts/cli
          npm install
          npm run build

      - name: Download ffmpeg/ffprobe
        run: bash scripts/cli.sh download-dependencies "${{ matrix.platform }}"

      - name: Build release
        run: bash scripts/cli.sh release "${{ matrix.platform }}" "$RELEASE"

      - name: Verify Apple Silicon binary
        if: ${{ matrix.platform == 'macos-arm64' }}
        run: test "$(lipo -archs "release/javboss-${RELEASE}-macos-arm64/javboss")" = arm64

      - name: Verify complete release archive
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { readFileSync } from 'node:fs';
          const platform = process.env.BUILD_PLATFORM;
          const archive = `release/javboss-${process.env.RELEASE}-${platform}.zip`;
          execFileSync('unzip', ['-tq', archive], { stdio: 'inherit' });
          const entries = execFileSync('unzip', ['-Z1', archive], { encoding: 'utf8' }).trim().split('\n');
          const common = ['config.toml', 'web/dist/index.html', 'modernz/modernz.lua', 'modernz/playlist_sidebar.lua', 'modernz/playlist_sidebar.conf', 'modernz/javboss_highlight_sidebar.lua', 'modernz/javboss_control.lua', 'modernz/window_geometry.lua'];
          const binaries = platform === 'windows-x86_64'
            ? ['javboss.exe', 'internal/bin/ffprobe.exe', 'internal/bin/mpv/mpv.exe']
            : ['javboss', 'javboss.command', 'internal/bin/ffprobe', 'internal/bin/ffmpeg', 'internal/bin/mpv/mpv.app/Contents/MacOS/mpv'];
          for (const name of [...common, ...binaries]) assert(entries.includes(`JavBoss/${name}`), `Missing runtime file: ${name}`);
          assert(entries.some(name => /^JavBoss\/web\/dist\/assets\/.+\.js$/.test(name)), 'Missing frontend bundle');
          assert(!entries.some(name => name.startsWith('JavBoss/data/')), 'Archive must not contain user data');
          for (const name of common.filter(name => name.startsWith('modernz/'))) {
            const bundled = execFileSync('unzip', ['-p', archive, `JavBoss/${name}`], { maxBuffer: 4 * 1024 * 1024 });
            assert(bundled.equals(readFileSync(name)), `Player asset differs from source: ${name}`);
          }
          if (platform === 'windows-x86_64') {
            const description = execFileSync('file', [`release/javboss-${process.env.RELEASE}-${platform}/javboss.exe`], { encoding: 'utf8' });
            assert.match(description, /PE32\+.*x86-64/, 'Expected Windows x86_64 executable');
            console.log(description.trim());
          }
          console.log(`Verified ${platform}: ZIP integrity, complete runtime, frontend and exact player scripts`);
          JS

      - name: Upload release asset
        uses: actions/upload-artifact@v6
        with:
          name: javboss-${{ inputs.release }}-${{ matrix.platform }}-zip
          path: release/javboss-${{ inputs.release }}-${{ matrix.platform }}.zip

  build-browser-extension:
    if: ${{ inputs.publish_browser_extension }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip

      - name: Read extension version
        id: extension
        run: |
          version="$(node -p "require('./browser-extension/manifest.json').version")"
          if [[ ! "$version" =~ ^[0-9]+(\.[0-9]+){0,3}$ ]]; then
            echo "invalid extension version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build CLI bundle
        run: |
          cd scripts/cli
          npm install
          npm run build

      - name: Build browser extension release
        run: bash scripts/cli.sh release-browser-extension

      - name: Upload browser extension release asset
        uses: actions/upload-artifact@v6
        with:
          name: javboss-browser-extension-v${{ steps.extension.outputs.version }}-zip
          path: release/javboss-browser-extension-v${{ steps.extension.outputs.version }}.zip

  publish:
    needs: [build, build-browser-extension]
    if: >-
      ${{ !cancelled() && needs.build.result == 'success' &&
          (needs.build-browser-extension.result == 'success' ||
           (!inputs.publish_browser_extension && needs.build-browser-extension.result == 'skipped')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download release assets
        uses: actions/download-artifact@v5
        with:
          path: release-artifacts

      - name: Publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PUBLISH_BROWSER_EXTENSION: ${{ inputs.publish_browser_extension }}
        run: |
          existing_tag="$(git ls-remote --tags origin "refs/tags/$RELEASE")"
          if [[ -n "$existing_tag" ]]; then
            echo "git tag '$RELEASE' already exists" >&2
            exit 1
          fi

          mapfile -t assets < <(find release-artifacts -type f -name "*.zip" | sort)
          expected_assets=2
          if [[ "$PUBLISH_BROWSER_EXTENSION" == "true" ]]; then
            expected_assets=3
          fi
          if [[ "${#assets[@]}" -ne "$expected_assets" ]]; then
            echo "expected $expected_assets release assets, found ${#assets[@]}" >&2
            exit 1
          fi

          gh release create "$RELEASE" "${assets[@]}" \
            --repo "$GH_REPO" \
            --target "${{ github.sha }}" \
            --draft \
            --title "JavBoss $RELEASE" \
            --generate-notes
